name: Deploy Frontend

# Fully automatic — no manual approval step, unlike terraform.yml. A bad
# frontend deploy is cheap to recover from (redeploy the previous good
# commit); it doesn't touch infrastructure.
on:
  push:
    branches: [development]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # If the app needs a build-time value (e.g. the API base URL,
      # VITE_API_URL=https://api.coolchange.me), add it as a repo
      # variable and reference it here, e.g.:
      #   env:
      #     VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Left out for now since it hasn't come up yet — add when it does.
      - name: Build frontend
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Same OIDC role as deploy-backend.yml (github_actions_deploy_role_arn) —
      # this one is scoped (modules/iam/ci_deploy_policy.tf) to only the
      # frontend bucket, SSM commands, and CloudFront invalidations, so
      # one role safely covers both deploy workflows.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-4

      # --delete removes files from the bucket that no longer exist in
      # this build (e.g. an old hashed JS bundle from a previous build) —
      # otherwise the bucket only ever grows.
      - name: Sync build output to S3
        run: aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }} --delete

      # Without this, CloudFront keeps serving cached old files at edge
      # locations for up to a day (its default TTL) after a new deploy.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
