name: Deploy Iteration Snapshot

# Manual only, on purpose — these are frozen snapshots for academic
# review, not something that should ever redeploy automatically on a
# push. Run this once per iteration, whenever you're ready to freeze it.
on:
  workflow_dispatch:
    inputs:
      iteration:
        description: "Which iteration to freeze (1, 2, or 3)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      ref:
        description: "Branch, tag, or commit SHA to build from"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-deploy-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # --base is what makes this a snapshot rather than a normal build:
      # it rewrites every asset URL in the built HTML/JS to be rooted at
      # /iterationN/ instead of /, matching where this build will actually
      # live in the bucket. Assumes the "build" script in package.json is
      # a plain `vite build` — if it's wrapped in something else, this
      # flag may not pass through cleanly.
      - name: Build frontend for this iteration
        run: npm run build -- --base=/iteration${{ inputs.iteration }}/
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Same deploy role as deployfrontend.yml — already scoped
      # (modules/iam/ci_deploy_policy.tf) to the whole bucket via a `/*`
      # wildcard, so no IAM changes needed for a new prefix.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-4

      # --delete is scoped to this prefix only (sync's target is the
      # iterationN/ folder itself), so it can't touch root or any other
      # iteration's files even though the IAM permission covers the
      # whole bucket.
      - name: Sync build output to this iteration's S3 prefix
        run: aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }}/iteration${{ inputs.iteration }}/ --delete

      # Scoped to this iteration's path only — doesn't invalidate or
      # touch the cache for root or any other iteration.
      - name: Invalidate this iteration's CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/iteration${{ inputs.iteration }}/*"